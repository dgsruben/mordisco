<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="description" content="Contador de calorías con foto: ChatGPT analiza el plato y Mordisco lleva tus macros, agua, pasos y peso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mordisco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, sticky date header, cards stacked, bottom tab bar with a raised camera button. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E7EDE7; --ink:#14201A; --muted:#5D6B63; --line:#D6DED7;
  --accent:#E4512F; --accent-soft:#FBE3DB; --on-accent:#FFFFFF;
  --prot:#3366DD; --carb:#D99A1A; --fat:#8A57D4; --water:#1A9CC4;
  --good:#2C9A58; --warn:#C98414; --bad:#D04040;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#171F1C; --surface-2:#212B27; --ink:#E9EFEB; --muted:#94A39B; --line:#2B3631;
  --accent:#FF6B48; --accent-soft:#3A221B; --on-accent:#1A0D08;
  --prot:#7099F5; --carb:#F0B94A; --fat:#AE88F0; --water:#4CC3E6;
  --good:#4CC27D; --warn:#E8A93A; --bad:#F06A6A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#171F1C; --surface-2:#212B27; --ink:#E9EFEB; --muted:#94A39B; --line:#2B3631;
  --accent:#FF6B48; --accent-soft:#3A221B; --on-accent:#1A0D08;
  --prot:#7099F5; --carb:#F0B94A; --fat:#AE88F0; --water:#4CC3E6;
  --good:#4CC27D; --warn:#E8A93A; --bad:#F06A6A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.hot{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
main{display:flex;flex-direction:column;gap:14px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav h1{margin:0;font-family:var(--display);font-weight:600;font-size:17px;text-transform:capitalize}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 b{font-weight:600;letter-spacing:0;text-transform:none;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mid small{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px}
.eq{display:flex;flex-direction:column;gap:6px;font-size:13.5px;min-width:0}
.eq div{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.eq span{color:var(--muted)}
.eq .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bar{display:flex;flex-direction:column;gap:5px;min-width:0}
.bar .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.bar .val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .val small{font-weight:500;color:var(--muted);font-size:12px}
.track{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.micro{display:flex;gap:8px;flex-wrap:wrap}
.micro .pill{background:var(--surface-2);border-color:transparent;font-weight:500}
.micro .pill b{font-weight:700}
.tip{font-size:13.5px;color:var(--muted);margin:0}
.tip strong{color:var(--ink)}
.water{display:flex;flex-wrap:wrap;gap:6px}
.drop{width:30px;height:38px;border-radius:8px 8px 12px 12px;border:1.5px solid var(--water);background:transparent;padding:0;position:relative;overflow:hidden}
.drop.on{background:var(--water)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--surface-2);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{display:flex;flex-direction:column;gap:8px}
.slot-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot-h h3{margin:0;font-size:15px;font-weight:700}
.slot-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--bg);border:0;text-align:left;width:100%}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px}
.meal .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal .kc{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.meal>div{min-width:0}
.addline{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:9px;color:var(--muted);font-weight:600;font-size:13.5px}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:19px;margin-bottom:4px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{border:0;background:transparent;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.fab{justify-self:center;width:64px;height:64px;border-radius:22px;border:4px solid var(--bg);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 8px 20px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.fab svg{width:28px;height:28px}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:40}
.backdrop{position:absolute;inset:0;background:rgba(5,10,8,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease}
.sheet .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 4px}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.track i{transition:none}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.opt b{font-size:15px}
.opt span{font-size:12.5px;color:var(--muted)}
.opt.main{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.main span{color:inherit;opacity:.85}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--surface-2)}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0;color:var(--muted);text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item-h{display:flex;gap:8px;align-items:center}
.item-h input{flex:1;font-weight:600}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.nums .field label{font-size:11px}
.nums input{padding:7px 6px;text-align:center;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.badge.alta{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.badge.media{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.badge.baja{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.sum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:12px;font-variant-numeric:tabular-nums}
.sum b{font-family:var(--display);font-size:24px;font-weight:800}
.sum div{display:flex;flex-direction:column}
.sum span{font-size:12px;color:var(--muted);font-weight:600}
.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--ink);border-radius:12px;padding:12px;font-size:14px}
.note{font-size:13px;color:var(--muted);margin:0}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.coach{font-size:14.5px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.coach p{margin:0 0 8px}
.coach ul{margin:0 0 8px;padding-left:18px}
.coach li{margin-bottom:4px}
.recent{display:flex;flex-direction:column;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);padding-block:7px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
#toast{display:flex;align-items:center;gap:12px}
.tbtn{border:0;background:transparent;color:var(--accent);font-weight:700;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.qk{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weekline{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.weekline b{color:var(--ink);font-variant-numeric:tabular-nums}
.weekline .track{height:5px}
.planrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:14px;background:var(--bg)}
.planrow>div{min-width:0}
.planrow .nm{font-weight:600;font-size:14px}
.planrow .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.planrow.done{opacity:.55}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{border:0;padding:0;background:transparent;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--surface-2)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}
.cmp figcaption{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Mordisco<span>.</span></div>
    <div class="pills" id="pills"></div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button class="tab on" data-act="tab" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
    <button class="tab" data-act="tab" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/></svg>Progreso</button>
    <button class="fab" data-act="quickphoto" aria-label="Hacer foto de comida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="tab" data-act="tab" data-tab="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18l-1 3 4-2h9a3 3 0 003-3V7a3 3 0 00-3-3H7a3 3 0 00-3 3v8"/><path d="M9 10h6M9 13h4"/></svg>Coach</button>
    <button class="tab" data-act="tab" data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Perfil</button>
  </div>
</nav>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" hidden>
<input type="file" id="bodyIn" accept="image/*" hidden>
<div id="sheetWrap" hidden><div class="backdrop" data-act="close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
